<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Voice Studio</title>
  <meta name="description" content="Teleprompter voice recorder for Geo Trivia X video dubbing." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <!-- CDNs for JSZip, lamejs, Lucide -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">
          <i data-lucide="mic" style="color: white; width: 22px; height: 22px;"></i>
        </div>
        <span class="brand-title">Voice Studio</span>
      </div>

      <div class="header-actions">
        <select id="templateSelector" class="template-select">
          <option value="geo-ghost-border">Ghost Border</option>
          <option value="geo-zoom-out-country">Zoom Out</option>
          <option value="geo-flag-puzzle">Flag Puzzle</option>
          <option value="custom">Custom</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Progress Indicator -->
    <div class="progress-container">
      <div class="progress-header">
        <span id="templateNameDisplay">Ghost Border</span>
        <div class="progress-stats">
          <i data-lucide="check-circle-2" style="width: 16px; height: 16px;"></i>
          <span id="progressText">0 / 11</span>
        </div>
      </div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <!-- Teleprompter View -->
    <div id="prompterView" class="prompter-container">
      <div class="prompter-nav">
        <button id="prevBtn" class="nav-btn">
          <i data-lucide="chevron-left" style="width: 18px; height: 18px;"></i>
          <span>Previous</span>
        </button>
        <span id="stepIndicator" class="step-indicator">1 / 11</span>
        <button id="nextBtn" class="nav-btn">
          <span>Next</span>
          <i data-lucide="chevron-right" style="width: 18px; height: 18px;"></i>
        </button>
      </div>

      <!-- Prompter Card -->
      <div class="teleprompter-card">
        <div id="prompterText" class="prompter-text">
          Guess the country just from its border shape, first round.
        </div>

        <div id="filenameHint" style="font-size: 0.72rem; color: var(--text-muted); text-align: center;">
          <code id="filenameCode" style="color: var(--accent-blue);">geo-ghost-border_q0.mp3</code>
        </div>
      </div>

      <!-- Recording Station -->
      <div class="recording-station">
        <canvas id="waveformCanvas" class="waveform-canvas"></canvas>
        <div id="timerDisplay" class="timer-display">00:00.0</div>

        <div class="record-action-group">
          <button id="recordBtn" class="record-btn" title="Start / Stop recording (Space)">
            <i id="recordBtnIcon" data-lucide="mic" class="record-btn-icon"></i>
          </button>
        </div>

        <!-- Audio Preview (When recorded) -->
        <div id="audioPreviewCard" class="audio-preview-card" style="display: none;">
          <audio id="audioPreviewPlayer" controls></audio>
          <div class="clip-actions">
            <button id="retakeBtn" class="icon-btn danger" title="Re-record this line">
              <i data-lucide="rotate-ccw" style="width: 16px; height: 16px;"></i>
            </button>
            <button id="downloadSingleBtn" class="icon-btn" title="Download this clip (.mp3)">
              <i data-lucide="download" style="width: 16px; height: 16px;"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Sticky Action Bar -->
  <footer class="bottom-bar">
    <div class="bottom-container">
      <button id="downloadZipBtn" class="download-zip-btn" disabled>
        <i data-lucide="download" style="width: 18px; height: 18px;"></i>
        <span id="downloadZipBtnText">Download</span>
      </button>

      <button id="clearAllBtn" class="clear-all-btn" title="Reset recordings">
        <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i>
      </button>
    </div>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- App Script -->
  <script src="app.js"></script>
</body>
</html>
